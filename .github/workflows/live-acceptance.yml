name: Live v1 Release Acceptance
on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected deployed commit SHA (blank = commit being audited)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: framefield-live-audit
  cancel-in-progress: false
jobs:
  live-acceptance:
    name: Audit deployed GitHub Pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit Pages built, not whatever main becomes later.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Wait for Pages CDN to serve the deployed commit
        env:
          FRAMEFIELD_LIVE_URL: https://michaelwave369.github.io/FramefieldStudio/
          FRAMEFIELD_EXPECTED_SHA: ${{ inputs.expected_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
        run: npm run wait:live
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Confirm live deployment across Chromium, Firefox and WebKit
        env:
          FRAMEFIELD_LIVE_URL: https://michaelwave369.github.io/FramefieldStudio/
          FRAMEFIELD_EXPECTED_SHA: ${{ inputs.expected_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
        run: npm run test:live
      - name: Preserve live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framefield-live-acceptance
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
