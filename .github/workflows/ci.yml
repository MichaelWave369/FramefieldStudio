name: React app CI
on:
  pull_request:
  push:
    branches: [feat/react-studio-pages]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test scene model
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Audit build provenance, license and deployed asset paths
        run: npm run audit:dist
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser runtime smoke test
        run: npx playwright test --max-failures=1
