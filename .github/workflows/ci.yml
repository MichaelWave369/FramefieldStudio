name: React app CI
on:
  pull_request:
  push:
    branches: [feat/react-studio-pages]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test scene model
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Audit build provenance, license and deployed asset paths
        run: npm run audit:dist
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser runtime smoke test
        run: npx playwright test --max-failures=1

  browser-compatibility:
    name: Cross-browser creator workflow (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Browser binaries and Ubuntu dependencies are already in this version-pinned image.
    # Avoid the slow apt-mirror installs that previously exhausted the 12-minute job limit.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Pages-path studio
        run: npm run build
      - name: Verify pinned Playwright runtime
        run: test "$(npx playwright --version)" = "Version 1.64.1"
      - name: Validate real editing, import, and rendering workflows
        run: npx playwright test -c playwright.compat.config.js --project ${{ matrix.browser }} --max-failures=1
      - name: Preserve compatibility test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: framefield-compat-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
